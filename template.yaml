AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Connection to Initial Contact for Respond.IO

### Mapeo para decidir el ambiente
Mappings:
  Environments:
    prod:
      Value: PRODUCCION
    qa:
      Value: QA
###


Parameters:
  Environment:
    Type: String
    Default: qa
    AllowedValues:
      - prod
      - qa
    Description: Ambiente de la aplicacion.

##  Ruta base para consulta de articulos de la api compartida con Respond.io
  integrationMainPath:
    Type: String
    Description: Ruta base para consulta de articulos de la api compartida
    Default: respond-io

Resources:


#  parameterResolver:
#    Type: AWS::Serverless::Application
#    Properties:
#      Location: parameter-resolver.yml
#      Parameters:
#        utilsIntelixLayerArn: !Sub /${Environment}/respond/parameters/layers/intelixpythonlayerutils
#        secretRespondIO: !Sub /${Environment}/respond/parameters/common/postgres/app_respond_io
#        securityGroupLambda: !Sub /${Environment}/respond/parameters/network/default-lambda-security-group
#        securityGroupProxy: !Sub /${Environment}/respond/parameters/rds/rdsproxysg
#        subnetIDs: !Sub /${Environment}/respond/parameters/network/subnet-ids
#        restApiIdInternal: !Sub /${Environment}/respond/parameters/apigateway/restapiidinternal
