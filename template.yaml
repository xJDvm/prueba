## PendingMessage Lambda
  PendingMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-respond-pending-message
      Runtime: python3.12
      Handler: lambda_handler.lambda_handler
      CodeUri: functions/respond-pending-message/
      Layers:
        - !Ref UtilsLayer
      Timeout: 30
      MemorySize: 128
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:respond/${Environment}/common/postgres/temp/firstContact-*
      Events: ## Evento programado para ejecutar cada minuto
        ScheduleEvent:
          Type: Schedule
          Properties:
            Name: !Sub ${AWS::StackName}-respond-pending-message
            Schedule: rate(1 minute)
            Description: "Schedule to check pending messages on respond.io"
      Environment:
        Variables:
          secretRespondIO: !Ref SecretCommonPostgresTempFC

  PendingMessageLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PendingMessageFunction}
      RetentionInDays: 30

## CloseAllConversations Lambda
  CloseAllConversationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-respond-close-all-conversations
      Runtime: python3.12
      Handler: lambda_handler.lambda_handler
      CodeUri: functions/respond-close-all-conversations/
      Layers:
        - !Ref UtilsLayer
      Timeout: 30
      MemorySize: 128
      Policies:
        - AWSLambdaBasicExecutionRole
        - !Ref GetSecretPolicy
        - Statement:
          - Effect: Allow
            Action: ses:SendEmail
            Resource: '*'
          - Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Environment}/respond/parameters/common/cr/respond-api-token
      Events: ## Evento programado para ejecutar a las 4 am
        ScheduleEvent:
          Type: Schedule
          Properties:
            Name: !Sub ${AWS::StackName}-respond-close-all-conversations
            Schedule: cron(0 4 * * ? *)
            Description: "Schedule to check pending messages on respond.io at 4 am"
      Environment:
        Variables:
          secretRespondIO: !Ref SecretCommonPostgresTempFC
          RESPOND_API_TOKEN: !Ref RespondApiTokenParameter  


  CloseAllConversationsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CloseAllConversationsFunction}
      RetentionInDays: 30

## Outputs
Outputs:
  ParameterPath:
    Value: !Ref RespondApiTokenParameter