### Se crea un SQS  para subscribirlo al SNS para control de errores de la lambda. 
  RespondContactSNSCreatedSQS:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: RespondContactSNSCreatedSQS
      VisibilityTimeout: 60

### Se subscribe el SQS al SNS
  RespondContactSNSCreatedSQSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref RespondContactSNSCreated
      Protocol: sqs
      Endpoint: !GetAtt RespondContactSNSCreatedSQS.Arn

### Se crea una politica que permite publicar mensajes en el SQS desde el SNS
  RespondContactSNSCreatedSQSSubscriptionPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: sns.amazonaws.com
          Action: sqs:SendMessage
          Resource: !GetAtt RespondContactSNSCreatedSQS.Arn
          Condition:
            ArnEquals:
              aws:SourceArn: !Ref RespondContactSNSCreated
      Queues:
        - !Ref RespondContactSNSCreatedSQS    



  ### Se crea un SQS  para subscribirlo al SNS para control de errores de la lambda. 
  KeywordsDetectedSNSSQS:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: KeywordsDetectedSNSSQS
      VisibilityTimeout: 60

### Se subscribe el SQS al SNS
  KeywordsDetectedSNSSQSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref MessageRecievedSNS
      Protocol: sqs
      Endpoint: !GetAtt KeywordsDetectedSNSSQS.Arn

### Se crea una politica que permite publicar mensajes en el SQS desde el SNS
