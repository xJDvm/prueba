## Lambdas
##AfterHourNotification Lambda
  afterHourNotificationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${afterHourNotificationFunction}
      RetentionInDays: 30

  afterHourNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-respond-after-hour-notification
      Runtime: python3.12
      Handler: lambda_handler.lambda_handler
      CodeUri: functions/respond-after-hour-notification/
      Layers:
        - !Ref UtilsLayer
      Timeout: 10
      MemorySize: 128
      Architectures:
        - x86_64
      Policies:
        - AWSLambdaBasicExecutionRole
        - !Ref GetSecretPolicy
        - !Ref GetApiParameterPolicy
        - !Ref GetConfigParameterPolicy
        - !Ref SendEmailPolicy  
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RespondAfterHourNotificationSQS.Arn
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Environment:
        Variables:
          secretRespondIO: !Ref SecretCommonPostgresTempFC  
          RESPOND_API_TOKEN: !Ref RespondApiTokenParameter
          RESPOND_CONFIG_PARAMETER: !Ref RespondConfigParameter


##AfterHourAssign Lambda
  AfterHourAssignLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AfterHourAssignFunction}
      RetentionInDays: 30

  AfterHourAssignFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-respond-after-hour-assign
      Runtime: python3.12
      Handler: lambda_handler.lambda_handler
      CodeUri: functions/respond-after-hour-assign/
      Layers:
        - !Ref UtilsLayer
      Timeout: 10
      MemorySize: 128
      Architectures:
        - x86_64
      Policies:
        - AWSLambdaBasicExecutionRole
        - !Ref GetSecretPolicy
        - !Ref GetApiParameterPolicy
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RespondAfterHourAssignSQS.Arn
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Environment:
        Variables:
          secretRespondIO: !Ref SecretCommonPostgresTempFC  
          RESPOND_API_TOKEN: !Ref RespondApiTokenParameter  


## KeywordsDetected Lambda
  KeywordsDetectedFunction:
