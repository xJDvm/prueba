### Se crea una lambda llamada por el SQS Created Contact
### Se un logroup para las lambdas
  afterHourNotificationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}/RespondContactSNSCreatedLambdaLogs
      RetentionInDays: 30


  afterHourNotificationPermission:
    Type: AWS::Lambda::Permission
    DependsOn:
      - afterHourNotificationFunction
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref afterHourNotificationFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${respondApiGateway}/*/POST/*


  afterHourNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: respond-after-hour-notification
      Runtime: python3.12
      Handler: lambda_handler.lambda_handler
      CodeUri: functions/respond-after-hour-notification/
      Timeout: 10
      MemorySize: 128
      Architectures:
        - x86_64
      LoggingConfig:
        LogGroup: !Ref afterHourNotificationLogGroup
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
          - Effect: Allow
            Action: ses:SendEmail
            Resource: '*'
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AfterHourMessageSNSSQS.Arn
            FunctionResponseTypes:
              - ReportBatchItemFailures

## Lambda con SQS de Record Conversation

  KeywordsDetectedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: respond-keyword-detection
      Runtime: python3.12
      Handler: lambda_handler.lambda_handler
      CodeUri: functions/respond-keyword-detection/
      Timeout: 30
      MemorySize: 128
      Architectures:
        - x86_64
      LoggingConfig:
        LogGroup: !Ref KeywordsDetectedLogGroup
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
          - Effect: Allow
            Action: ses:SendEmail
            Resource: '*'
          - Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Environment}/respond/parameters/common/cr/respond-api-token
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt KeywordsDetectedSNSSQS.Arn
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Environment:
        Variables:
          RESPOND_API_TOKEN: !Ref RespondApiTokenParameter  

  KeywordsDetectedLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}/KeywordsDetectedFunction
      RetentionInDays: 30


  KeywordsDetectedPermission:
    Type: AWS::Lambda::Permission
    DependsOn:
      - KeywordsDetectedFunction
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref KeywordsDetectedFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${respondApiGateway}/*/POST/*

  