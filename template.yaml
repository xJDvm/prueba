  ConversationClosedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-respond-conversation-closed
      Runtime: python3.12
      Handler: lambda_handler.lambda_handler
      CodeUri: functions/respond-conversation-closed/
      Layers:
        - !Ref UtilsLayer
      Timeout: 30
      MemorySize: 128
      Policies:
        - AWSLambdaBasicExecutionRole
