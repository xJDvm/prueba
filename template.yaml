## Lambdas
##AfterHourNotification Lambda
  afterHourNotificationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${afterHourNotificationFunction}
      RetentionInDays: 30

  afterHourNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-respond-after-hour-notification
      Runtime: python3.12
      Handler: lambda_handler.lambda_handler
      CodeUri: functions/respond-after-hour-notification/
      Layers:
        - !Ref UtilsLayer
      Timeout: 10
      MemorySize: 128
      Architectures:
        - x86_64
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
          - Effect: Allow
            Action: ses:SendEmail
            Resource: '*'
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:respond/${Environment}/common/postgres/temp/firstContact-*
          - Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Environment}/respond/parameters/common/cr/respond-api-token
      
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RespondAfterHourNotificationSQS.Arn
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Environment:
        Variables:
          secretRespondIO: !Ref SecretCommonPostgresTempFC  
          RESPOND_API_TOKEN: !Ref RespondApiTokenParameter  


