  # Secret
  SecretCommonPostgresTempFC:
    Type: AWS::SecretsManager::Secret
    Properties:
      # TODO: Change this to your secret name
      Name: !Sub respond/${Environment}/common/postgres/temp/firstContact
      Description: Secret for RDS Proxy connection
      GenerateSecretString:
        SecretStringTemplate: '{"username": "masteradmin", "engine": "aurora-postgresql"}'
        GenerateStringKey: password
        PasswordLength: 16
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Ambiente
          Value: !FindInMap
            - Environments
            - !Ref Environment
            - Value

  SecretCommonPostgresOutputParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Environment}/respond/parameters/common/cr/secret/postgres/temp
      Type: String
      Value: !Ref SecretCommonPostgresTempFC
      Description: !Sub ${AWS::StackName} SecretCommonPostgresTempFC


  # Definir el cluster de Aurora
  AuroraDBCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineVersion: 15.4
      Port: 5432
      EngineMode: provisioned
      MasterUsername: !Sub '{{resolve:secretsmanager:${SecretCommonPostgresTempFC}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${SecretCommonPostgresTempFC}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DBSecurityGroup
      PreferredMaintenanceWindow: Sun:06:00-Sun:07:00

  # Definir la instancia de Aurora
  AuroraDBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref AuroraDBCluster
      DBSubnetGroupName: !Ref DBSubnetGroup
      DBInstanceClass: db.t3.medium
      Engine: aurora-postgresql
      EnablePerformanceInsights: true
      PerformanceInsightsRetentionPeriod: 31
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt DBPostgresMonitoringRoleTempFC.Arn
      #Colocar en false a la hora de pasar a PROD
      PubliclyAccessible: true

  # Definir el grupo de subredes para el RDS
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Aurora RDS
      SubnetIds:
        - subnet-7e8e1006
        - subnet-508fe60d

  # Definir el grupo de seguridad para el RDS
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Aurora RDS
      VpcId: vpc-af2b26d7
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
          #CidrIp: 10.48.0.0/16

  # Definir el rol de monitoreo para el RDS
  DBPostgresMonitoringRoleTempFC:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - monitoring.rds.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

  # Api para Respond.io
  respondApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: api


  HealthCheckResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref respondApiGateway
      ParentId: !GetAtt respondApiGateway.RootResourceId
      PathPart: health
    DependsOn:
      - respondApiGateway

  HealthCheckMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref respondApiGateway
      ResourceId: !Ref HealthCheckResource
      HttpMethod: GET
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HealthCheckLambda}/invocations"
        IntegrationResponses:
          - StatusCode: '200'
            ResponseTemplates:
              application/json: "{\"message\": \"archivo json recibido\"}"
        MethodResponses:
          - StatusCode: '200'
            ResponseModels:
              application/json: Empty
    DependsOn:
      - respondApiGateway
      - HealthCheckResource
      - HealthCheckLambda


  ApiKey:
    Type: 'AWS::ApiGateway::ApiKey'
    Properties:
      Name: !Sub ${Environment}-respondApiKey
      Description: CloudFormation API Key V1
      Enabled: true
      StageKeys:
        - RestApiId: !Ref respondApiGateway
          StageName: api
    DependsOn:
      - respondApiGateway
      # - ApiDeployment

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    Properties:
      Description: Respond API Deployment
      RestApiId: !Ref respondApiGateway
      StageName: api
    DependsOn:
      - HealthCheckMethod
      - HealthCheckResource

  ApiUsagePlan:
    Type: 'AWS::ApiGateway::UsagePlan'
    Properties:
      ApiStages:
        - ApiId: !Ref respondApiGateway
          Stage: Api
      Description: Usage plan for respond
    #DependsOn:
      #- ApiKey
      #- ApiDeployment

  ApiUsagePlanKey:
    Type: 'AWS::ApiGateway::UsagePlanKey'
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ApiUsagePlan
    #DependsOn:
      #- ApiUsagePlan

  # Secret Manager para almacenar el token del api
  secretmanagertokenapi:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub /${Environment}/respond/secretmanagertokenapi
      Description: secretmanagertokenapi
      SecretString: '{"PRIVATE-TOKEN":"replacement", "ENDPOINT":"replacement" }'


  # # Lambdas
  HealthCheckLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: HealthCheckFunction
      Runtime: python3.12
      Handler: lambda_handler.py
      CodeUri: functions/health-check-function/
      # Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 5
      MemorySize: 128

