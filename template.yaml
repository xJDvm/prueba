        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt AnalyzeConversationFunction.Arn
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RespondConversationClosedSQS.Arn
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Environment:
        Variables:
          secretRespondIO: !Ref SecretCommonPostgresTempFC
          ANALYZE_CONVERSATION_FUNCTION_NAME: !Ref AnalyzeConversationFunction

  ConversationClosedLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ConversationClosedFunction}
      RetentionInDays: 30


## AnalyzeConversation Lambda
  AnalyzeConversationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-respond-analyze-conversation
      Runtime: python3.12
      Handler: lambda_handler.lambda_handler
