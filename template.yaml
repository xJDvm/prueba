AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Connection to Initial Contact for Respond.IO

### Mapeo para decidir el ambiente
Mappings:
  Environments:
    prod:
      Value: PRODUCCION
    qa:
      Value: QA
    dev:
      Value: DEV
###


Parameters:
  Environment:
    Type: String
    Default: qa
    AllowedValues:
      - prod
      - qa
      - dev
    Description: Ambiente de la aplicacion.


  SubnetIds:
    Type: String
    Default: Subnets para los recursos subnetid-1,subnetid-2
    Description: SubnetIds.

  VpcId:
    Type: String

# Globals:
#   Function:
#     VpcConfig:
#       SubnetIds: !Split
#         - ','
#         - !Ref SubnetIds
#       SecurityGroupIds:
#         - !Ref SegurityGroupLambdaDefault



Resources:

  GlobalSQSPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref RespondMessageReceivedSQS
        - !Ref RespondAfterHourNotificationSQS
        - !Ref RespondAfterHourAssignSQS
        - !Ref RespondMessageSentUserSQS
        - !Ref RespondContactCreatedSQS
        - !Ref RespondContactUpdatedSQS
        - !Ref RespondContactAssigneeUpdatedSQS
        - !Ref RespondCoversationOpenedSQS
        - !Ref RespondCoversationClosedSQS
        - !Ref RespondMessageSentWorkflowSQS
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: 
              - !GetAtt RespondMessageReceivedSQS.Arn
              - !GetAtt RespondAfterHourNotificationSQS.Arn
              - !GetAtt RespondAfterHourAssignSQS.Arn
              - !GetAtt RespondMessageSentUserSQS.Arn
              - !GetAtt RespondContactCreatedSQS.Arn
              - !GetAtt RespondContactUpdatedSQS.Arn
              - !GetAtt RespondContactAssigneeUpdatedSQS.Arn
              - !GetAtt RespondCoversationOpenedSQS.Arn
              - !GetAtt RespondCoversationClosedSQS.Arn
              - !GetAtt RespondMessageSentWorkflowSQS.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref RespondSNSEntryPoint

  GetSecretPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:respond/${Environment}/common/postgres/temp/firstContact-*

  UtilsLayer:
    Type: AWS::Serverless::LayerVersion
    DeletionPolicy: Delete
    Properties:
      LayerName: !Sub ${AWS::StackName}-UtilsLayer
      ContentUri: ./functions/layers/utils
      CompatibleRuntimes:
        - python3.12
      Description: Utils Layer to use in the lambdas
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12


  SegurityGroupLambdaDefault:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${AWS::StackName}-lambdadefault"
      GroupDescription: "default lambda security groups"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: -1          
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1          
          CidrIp: 0.0.0.0/0



## Secret Manager Postgres

  SecretCommonPostgresTempFC:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub respond/${Environment}/common/postgres/temp/firstContact
      Description: Secret for RDS Proxy connection
      GenerateSecretString:
        SecretStringTemplate: '{"username": "masteradmin", "engine": "aurora-postgresql"}'
        GenerateStringKey: password
        PasswordLength: 16
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Ambiente
          Value: !FindInMap
            - Environments
            - !Ref Environment
            - Value

  SecretCommonPostgresOutputParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Environment}/respond/parameters/common/cr/secret/postgres/temp
      Type: String
      Value: !Ref SecretCommonPostgresTempFC
      Description: !Sub ${AWS::StackName} SecretCommonPostgresTempFC

  
## Parameter Store
  RespondApiTokenParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Environment}/respond/parameters/common/cr/respond-api-token
      Type: String
      Value: change-me

  RespondConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Environment}/respond/parameters/common/cr/respond-config
      Type: String
      Value: change-me

## Aurora RDS
  AuroraDBCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineVersion: 16.6
      Port: 5432
      EngineMode: provisioned
      MasterUsername: !Sub '{{resolve:secretsmanager:${SecretCommonPostgresTempFC}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${SecretCommonPostgresTempFC}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DBSecurityGroup
      PreferredMaintenanceWindow: Sun:08:00-Sun:09:00

  AuroraDBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref AuroraDBCluster
      DBSubnetGroupName: !Ref DBSubnetGroup
      DBInstanceClass: db.r8g.large
      Engine: aurora-postgresql
      EnablePerformanceInsights: true
      PerformanceInsightsRetentionPeriod: 31
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt DBPostgresMonitoringRoleTempFC.Arn
      PubliclyAccessible: true

#DB Security Groups
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Aurora RDS
      SubnetIds: !Split
        - ','
        - !Ref SubnetIds


  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Aurora RDS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0

  DBPostgresMonitoringRoleTempFC:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - monitoring.rds.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

## API Gateway Respond
  respondApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${AWS::StackName}-respond
      Policy: !Sub |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": "*",
                "Action": "execute-api:Invoke",
                "Resource": "arn:aws:execute-api:us-west-2:054670858840:9vefhxvgeb/*/*/*"
              },
              {
                "Effect": "Deny",
                "Principal": "*",
                "Action": "execute-api:Invoke",
                "Resource": "arn:aws:execute-api:us-west-2:054670858840:9vefhxvgeb/*/*/*",
                "Condition": {
                  "NotIpAddress": {
                    "aws:SourceIp": [
                      "52.74.35.155/32",
                      "18.138.31.163/32",
                      "54.169.155.20/32",
                      "190.120.253.223/32"]
                  }
                }
              }
            ]
          }

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    Properties:
      RestApiId: !Ref respondApiGateway
      StageName: api
    DependsOn:
      - RespondApiPostMethod
      - RespondAPIResource

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub ${Environment}-respondApiKey
      Enabled: true
      StageKeys:
        - RestApiId: !Ref respondApiGateway
          StageName: api
    DependsOn:
      - ApiDeployment

  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      ApiStages:
        - ApiId: !Ref respondApiGateway
          Stage: api
      Description: Usage plan for respond
    DependsOn:
      - ApiKey
      - ApiDeployment

  ApiUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ApiUsagePlan
    DependsOn:
      - ApiDeployment


##  SQS 
  respondSqsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-respond-sqs-queue
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt respondSqsDLQ.Arn
        maxReceiveCount: 5

  respondSqsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-respond-sqs-dlq


### Creación de punto de contacto inicial para el webhook
  ### Se crea un eventbus personalizado para estos mensajes. 
  RespondEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: RespondEventBus

  RespondWorkflowEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: RespondWorkflowEventBus




  # Lambda permission to allow invocation by API Gateway
  LambdaApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      FunctionName: !GetAtt getCustomerDataFunction.Arn

  ### Se crea un rol que permite a ApiGateway publicar mensajes en el Bus (el api se define en el próximo recurso). 
  ApiGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - apigateway.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: AllowPutEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref RespondSNSEntryPoint
              - Effect: Allow
                Action:
                  - events:PutEvents
                  - events:PutEvent
                Resource: !GetAtt RespondEventBus.Arn


                

 ### Se crea un rol que permite a ApiGateway publicar mensajes en el Bus (el api se define en el próximo recurso). 
  ApiGatewayRoleWorkflow:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - apigateway.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: AllowPutEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                  - events:PutEvent
                Resource: !GetAtt RespondWorkflowEventBus.Arn



  FlowTypeAPIResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt respondApiGateway.RootResourceId
      PathPart: "{flowtype}"
      RestApiId: !Ref respondApiGateway

  RespondAPISNSResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt FlowTypeAPIResource.ResourceId
      PathPart: "notification"
      RestApiId: !Ref respondApiGateway


  RespondAPIPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      ResourceId: !Ref RespondAPISNSResource
      RestApiId: !Ref respondApiGateway
      AuthorizationType: "NONE"
      HttpMethod: "POST"
      Integration:
        Type: "AWS"
        IntegrationHttpMethod: "POST"
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:sns:path//
        Credentials: !GetAtt ApiGatewayRole.Arn
        IntegrationResponses:
        - StatusCode: 200
          ResponseTemplates:
            "application/json": !Sub "{\"body\": \"Successfully published message to SNS topic\"}"
        RequestParameters:
          integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
        RequestTemplates: 
          application/json : !Sub  
            - |
              #set($body_respondio=$util.urlEncode($input.body))
              #set($event_type=$input.path('$.event_type'))
              ${SNSParameters}
            - SNSParameters: !Join
              - '&'
              - - Action=Publish
                - !Sub TopicArn=$util.urlEncode('${RespondSNSEntryPoint}')
                - MessageAttributes.entry.1.Name=flowtype
                - MessageAttributes.entry.1.Value.DataType=String
                - MessageAttributes.entry.1.Value.StringValue=$util.escapeJavaScript($method.request.path.flowtype)
                - MessageAttributes.entry.2.Name=event_type
                - MessageAttributes.entry.2.Value.DataType=String
                - MessageAttributes.entry.2.Value.StringValue=$event_type
                - Message=$body_respondio
        PassthroughBehavior: WHEN_NO_TEMPLATES
        ContentHandling: CONVERT_TO_TEXT     
      MethodResponses:
      - StatusCode: 200




### Se crea un resource para el apigateway (/test)
  RespondAPIResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt respondApiGateway.RootResourceId
      PathPart: respond
      RestApiId: !Ref respondApiGateway


### Se crea el método post donde ocurre la "magia" de publicar al eventbridge. 
  RespondApiPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      ResourceId: !Ref RespondAPIResource
      RestApiId: !Ref respondApiGateway
      AuthorizationType: NONE
      HttpMethod: POST
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: Empty
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
      RequestParameters:
        method.request.header.X-Amz-Target: false
        method.request.header.Content-Type: false
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Credentials: !GetAtt ApiGatewayRole.Arn
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:events:action/PutEvents
        PassthroughBehavior: NEVER
        RequestTemplates:
          application/json: !Sub
            - |
              #set($context.requestOverride.header.X-Amz-Target = "AWSEvents.PutEvents")
              #set($context.requestOverride.header.Content-Type = "application/x-amz-json-1.1")
              #set($inputRoot = $input.json('$'))
              {
                  "Entries": [
                      {
                          "Detail": "$util.escapeJavaScript($inputRoot).replaceAll("\\'","'")",
                          "DetailType": "EventBridge from APIGW",
                          "EventBusName": "${EventBusName}",
                          "Source": "respondio.webhook"
                      }
                  ]
              }
            - EventBusName: !Ref RespondEventBus
        IntegrationResponses:
          - StatusCode: 200
            ResponseTemplates:
              application/json: |-
                #set($val = $input.path('$.Entries[0].EventId'))
                {
                  "response": "$val"
                }
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: '''Content-Type'''
              method.response.header.Access-Control-Allow-Methods: '''POST'''
              method.response.header.Access-Control-Allow-Origin: '''*'''


  RespondWorkflowAPIResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt respondApiGateway.RootResourceId
      PathPart: workflow
      RestApiId: !Ref respondApiGateway



  RespondWorkflowApiPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      ResourceId: !Ref RespondWorkflowAPIResource
      RestApiId: !Ref respondApiGateway
      AuthorizationType: NONE
      HttpMethod: POST
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: Empty
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
      RequestParameters:
        method.request.header.X-Amz-Target: false
        method.request.header.Content-Type: false
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Credentials: !GetAtt ApiGatewayRoleWorkflow.Arn
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:sns:action/Publish
        PassthroughBehavior: NEVER
        RequestTemplates:
          application/json: !Sub
            - |
              #set($context.requestOverride.header.X-Amz-Target = "SNS.Publish")
              #set($context.requestOverride.header.Content-Type = "application/x-amz-json-1.0")
              #set($inputRoot = $input.json('$'))
              {
                  "Message": "$util.escapeJavaScript($inputRoot).replaceAll("\\'","'")",
                  "TopicArn": "${SNSTopicArn}"
              }
            - SNSTopicArn: !Ref RespondSNSGlobal
        IntegrationResponses:
          - StatusCode: 200
            ResponseTemplates:
              application/json: |-
                #set($val = $input.path('$.MessageId'))
                {
                  "response": "$val"
                }
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: '''Content-Type'''
              method.response.header.Access-Control-Allow-Methods: '''POST'''
              method.response.header.Access-Control-Allow-Origin: '''*'''



  RespondUserAPIResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt respondApiGateway.RootResourceId
      PathPart: user
      RestApiId: !Ref respondApiGateway


  RespondUserApiPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      ResourceId: !Ref RespondUserAPIResource
      RestApiId: !Ref respondApiGateway
      AuthorizationType: NONE
      HttpMethod: GET
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getCustomerDataFunction.Arn}/invocations
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: Empty
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true


