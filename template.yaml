## SaveMessageReceivedToDatabase Lambda
  SaveMessageReceivedToDatabaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-respond-save-message-received
      Runtime: python3.12
      Handler: lambda_handler.lambda_handler
      CodeUri: functions/respond-save-message-received/
      Layers:
        - !Ref UtilsLayer
      Timeout: 30
      MemorySize: 128
      Policies:
        - AWSLambdaBasicExecutionRole
        - !Ref GetSecretPolicy
        - !Ref GetApiParameterPolicy
        - !Ref GetConfigParameterPolicy
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RespondMessageReceivedSQS.Arn
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Environment:
        Variables:
          secretRespondIO: !Ref SecretCommonPostgresTempFC
          RESPOND_API_TOKEN: !Ref RespondApiTokenParameter  
      VpcConfig:
        SubnetIds: !Split [",", !GetAtt parameterResolver.Outputs.subnetIDs]
        SecurityGroupIds:
          - !Ref SecurityGroupLambdaDefault


  SaveMessageReceivedToDatabaseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SaveMessageReceivedToDatabaseFunction}
      RetentionInDays: 30

