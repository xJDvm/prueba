AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Connection to Initial Contact for Respond.IO

### Mapeo para decidir el ambiente
Mappings:
  Environments:
    prod:
      Value: PRODUCCION
    qa:
      Value: QA
###


Parameters:
  Environment:
    Type: String
    Default: qa
    AllowedValues:
      - prod
      - qa
    Description: Ambiente de la aplicacion.

  AccessKeyId:
    Type: String
    Description: Access Key ID for SMTP
    Default: default-access-key-id

  SecretAccessKey:
    Type: String
    Description: Secret Access Key for SMTP
    Default: default-secret-access-key

  Host:
    Type: String
    Description: SMTP Host
    Default: default-smtp-host

  Port:
    Type: String
    Description: SMTP Port
    Default: '587'

  ##  Ruta base para consulta de articulos de la api compartida con Respond.io
  integrationMainPath:
    Type: String
    Description: Ruta base para consulta de articulos de la api compartida
    Default: respond-io

Resources:

  ## Secret Manager Postgres

  SecretCommonPostgresTempFC:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub respond/${Environment}/common/postgres/temp/firstContact
      Description: Secret for RDS Proxy connection
      GenerateSecretString:
        SecretStringTemplate: '{"username": "masteradmin", "engine": "aurora-postgresql"}'
        GenerateStringKey: password
        PasswordLength: 16
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Ambiente
          Value: !FindInMap
            - Environments
            - !Ref Environment
            - Value

  SecretCommonPostgresOutputParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Environment}/respond/parameters/common/cr/secret/postgres/temp
      Type: String
      Value: !Ref SecretCommonPostgresTempFC
      Description: !Sub ${AWS::StackName} SecretCommonPostgresTempFC

  ## Aurora RDS
  AuroraDBCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineVersion: 15.4
      Port: 5432
      EngineMode: provisioned
      MasterUsername: !Sub '{{resolve:secretsmanager:${SecretCommonPostgresTempFC}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${SecretCommonPostgresTempFC}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DBSecurityGroup
      PreferredMaintenanceWindow: Sun:06:00-Sun:07:00

  AuroraDBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref AuroraDBCluster
      DBSubnetGroupName: !Ref DBSubnetGroup
      DBInstanceClass: db.t3.medium
      Engine: aurora-postgresql
      EnablePerformanceInsights: true
      PerformanceInsightsRetentionPeriod: 31
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt DBPostgresMonitoringRoleTempFC.Arn
      PubliclyAccessible: true

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Aurora RDS
      SubnetIds:
        - subnet-7e8e1006
        - subnet-508fe60d

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Aurora RDS
      VpcId: vpc-af2b26d7
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0

  DBPostgresMonitoringRoleTempFC:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - monitoring.rds.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

  ## API Gateway Respond
  respondApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${AWS::StackName}-respond

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    Properties:
      RestApiId: !Ref respondApiGateway
      StageName: api
    DependsOn:
      - RespondApiPostMethod
      - RespondAPIResource

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub ${Environment}-respondApiKey
      Enabled: true
      StageKeys:
        - RestApiId: !Ref respondApiGateway
          StageName: api
    DependsOn:
      - respondApiGateway
      - ApiDeployment

  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      ApiStages:
        - ApiId: !Ref respondApiGateway
          Stage: api
      Description: Usage plan for respond
    DependsOn:
      - ApiKey
      - ApiDeployment

  ApiUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ApiUsagePlan
    DependsOn:
      - ApiUsagePlan
      - ApiDeployment

  secretmanagertokenapi:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub /${Environment}/respond/secretmanagertokenapi
      Description: Secret Manager Token API
      SecretString: '{"PRIVATE-TOKEN":"replacement", "ENDPOINT":"replacement"}'

  RespondApiTokenParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Environment}/respond/parameters/common/cr/respond-api-token
      Type: String
      Value: change-me

  ## Lambdas

  ### Health Check Lambda


  HealthCheckLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: HealthCheckFunction
      Runtime: python3.12
      Handler: lambda_handler.lambda_handler
      CodeUri: functions/health-check-function/
      Timeout: 5
      MemorySize: 128
      Policies:
        - AWSLambdaBasicExecutionRole

  HealthCheckPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HealthCheckLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${respondApiGateway}/*/GET/*

  ### get customer data Lambda

  getCustomerDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: respond-get-customer-data
      Runtime: python3.12
      Handler: lambda_handler.lambda_handler
      CodeUri: functions/respond-get-customer-data/
      Timeout: 30
      MemorySize: 128
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:respond/${Environment}/common/postgres/temp/firstContact-*
      Environment:
        Variables:
          secretRespondIO: !Ref SecretCommonPostgresOutputParameter

  getCustomerDataLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: getCustomerDataFunction
    Properties:
      LogGroupName: !Sub /aws/lambda/${getCustomerDataFunction}
      RetentionInDays: 30


  CustomerDataPermission:
    Type: AWS::Lambda::Permission
    DependsOn:
      - getCustomerDataFunction
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref getCustomerDataFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${respondApiGateway}/*/GET/*





##  SQS 
  respondSqsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-respond-sqs-queue
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt respondSqsDLQ.Arn
        maxReceiveCount: 5

  respondSqsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-respond-sqs-dlq


### Creación de punto de contacto inicial para el webhook
  ### Se crea un eventbus personalizado para estos mensajes. 
  RespondEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: RespondEventBus



  ### Se crea un rol que permite a ApiGateway publicar mensajes en el Bus (el api se define en el próximo recurso). 
  ApiGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - apigateway.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: AllowPutEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                  - events:PutEvent
                Resource: !GetAtt RespondEventBus.Arn


### Se crea un resource para el apigateway (/test)
  RespondAPIResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt respondApiGateway.RootResourceId
      PathPart: respond
      RestApiId: !Ref respondApiGateway


### Se crea el método post donde ocurre la "magia" de publicar al eventbridge. 
  RespondApiPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      ResourceId: !Ref RespondAPIResource
      RestApiId: !Ref respondApiGateway
      AuthorizationType: NONE
      ApiKeyRequired: true
      HttpMethod: POST
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: Empty
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
      RequestParameters:
        method.request.header.X-Amz-Target: false
        method.request.header.Content-Type: false
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Credentials: !GetAtt ApiGatewayRole.Arn
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:events:action/PutEvents
        PassthroughBehavior: NEVER
        RequestTemplates:
          application/json: !Sub
            - |
              #set($context.requestOverride.header.X-Amz-Target = "AWSEvents.PutEvents")
              #set($context.requestOverride.header.Content-Type = "application/x-amz-json-1.1")
              #set($inputRoot = $input.json('$'))
              {
                  "Entries": [
                      {
                          "Detail": "$util.escapeJavaScript($inputRoot).replaceAll("\\'","'")",
                          "DetailType": "EventBridge from APIGW",
                          "EventBusName": "${EventBusName}",
                          "Source": "respondio.webhook"
                      }
                  ]
              }
            - EventBusName: !Ref RespondEventBus
        IntegrationResponses:
          - StatusCode: 200
            ResponseTemplates:
              application/json: |-
                #set($val = $input.path('$.Entries[0].EventId'))
                {
                  "response": "$val"
                }
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: '''Content-Type'''
              method.response.header.Access-Control-Allow-Methods: '''POST'''
              method.response.header.Access-Control-Allow-Origin: '''*'''

### Se crea el SNS al que se subscriben los SQS de las lambdas ó lambdas directamente que necesitan escuchar cuando llegue un mensaje tipo Contact.Created .
  RespondContactSNSCreated:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: RespondContactSNSCreated

### Se crea una politica que permite que eventbridge mande mensajes al SNS.
  ContactCreatedEventToSNSPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      PolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sns:Publish
          Resource: !Ref RespondContactSNSCreated
          Condition:
            ArnEquals:
              aws:SourceArn: !GetAtt ContactCreatedtoSNSRule.Arn
      Topics:
        - !Ref RespondContactSNSCreated

    ### Se crea una regla que hace match con contacto creado en el eventbridge y se envía el mensaje al SNS
  ContactCreatedtoSNSRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref RespondEventBus
      EventPattern:
        source:
          - respondio.webhook
        detail:
          event_type:
            - contact.created
      Targets:
        - Arn: !Ref RespondContactSNSCreated
          Id: ContactCreatedtoSNSRule

   ### Se crea el SNS al que se subscriben los SQS de las lambdas ó lambdas directamente que necesitan escuchar cuando llegue un mensaje tipo Contact.Created .
  MessageRecievedSNS:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: MessageRecievedSNS

  ### Se crea una regla que hace match con contacto creado en el eventbridge y se envía el mensaje al SNS
  MessageRecievedSNSRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref RespondEventBus
      EventPattern:
        source:
          - respondio.webhook
        detail:
          event_type:
            - message.received
      Targets:
        - Arn: !Ref MessageRecievedSNS
          Id: MessageRecievedSNSRule

### Se crea una politica que permite que eventbridge mande mensajes al SNS.
  MessageRecievedSNSPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      PolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sns:Publish
          Resource: !Ref MessageRecievedSNS
          Condition:
            ArnEquals:
              aws:SourceArn: !GetAtt MessageRecievedSNSRule.Arn
      Topics:
        - !Ref MessageRecievedSNS

   ### Se crea el SNS al que se subscriben los SQS de las lambdas ó lambdas directamente que necesitan escuchar cuando llegue un mensaje tipo Contact.Created .
  AfterHourMessageSNS:
